name: SparkTread
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoldenEagleKit:
    path: .
  # Firebase Analytics (owner 2026-10-09), app target only — the adapters
  # name the events through `AnalyticsSink`; the SDK never enters the
  # package. The AdId-free product: no IDFA, no tracking prompt.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SparkTread:
    type: application
    platform: iOS
    sources:
      - Sources/GoldenEagleApp
      - path: Vendor/SparkTreadPixel/Atlases
        buildPhase: resources
        # The mine atlas is art for a mechanic R5 removed (ADR-0018). It stays
        # in the delivery, which is an archive, but there is no reason to ship
        # it: nothing in the app can reference it.
        excludes:
          - PixelMines.atlas
      - path: Vendor/SparkTreadPixel/Metadata/pixel_assets.json
        buildPhase: resources
      - path: Content/stages
        buildPhase: resources
      - path: Content/campaigns
        buildPhase: resources
      - path: Content/difficulties
        buildPhase: resources
    dependencies:
      - package: GoldenEagleKit
        product: AppleAdapters
      - package: Firebase
        product: FirebaseAnalyticsCore
    info:
      path: Sources/GoldenEagleApp/Info.plist
      properties:
        # The launch image is MenuBackdrop.Field baked by
        # `swift run launch-screen-renderer`; LaunchScreenTests holds the
        # two together. (A launch storyboard was tried first and the iOS 26
        # simulator never showed it.)
        UILaunchScreen:
          UIImageName: LaunchBackdrop
          UIColorName: LaunchBase
          UIImageRespectsSafeAreaInsets: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.icell.sparktread
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1" # V1 ships for iPhone only (ADR-0028)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HFA66PX9R5 # personal team (free provisioning)
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
schemes:
  SparkTread:
    build:
      targets:
        SparkTread: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: GoldenEagleKit/GameCoreTests
        - package: GoldenEagleKit/GameApplicationTests
        - package: GoldenEagleKit/AppleAdapterTests
        - package: GoldenEagleKit/ContentValidationTests
