# Generate with: xcodegen generate  (requires Xcode + xcodegen)
#
# The .xcodeproj is a build artifact and is gitignored — this file is the source of truth.
# The app target compiles App/, Sources/AppleAdapters/, and the two PixelProduction runtime
# adapters, and consumes the headless simulation through the local Swift package.

name: SparkTread

options:
  bundleIdPrefix: com.icell
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  SparkTread:
    path: .

targets:
  SparkTread:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: App
      - path: Sources/AppleAdapters
      # Presentation adapters shipped with the art package. Compiled into the app target so
      # they can stay internal; they are not part of the Swift package.
      - path: PixelProduction/Runtime/PixelArt.swift
      - path: PixelProduction/Runtime/PixelPresentation.swift

      # Atlas folders are added as folder references so Xcode's texture-atlas build phase
      # compiles each one into a .atlasc. Flattening them into groups would collide on the
      # repeated PNG names inside.
      - path: PixelProduction/Atlases/PixelBase.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelDecals.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelEffects.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelEquipment.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelFoliage.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelGround.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelLiquids.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelMines.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelPickups.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelProjectiles.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelStatus.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelTanks.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelTerrain.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelTreads.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelTurrets.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelUI.atlas
        type: folder
        buildPhase: resources
      - path: PixelProduction/Atlases/PixelWalls.atlas
        type: folder
        buildPhase: resources

      # Sprite manifest. PixelArt looks for it in the Metadata subdirectory or at the
      # bundle root; this keeps it at the bundle root.
      - path: PixelProduction/Metadata/pixel_assets.json
        buildPhase: resources

    dependencies:
      - package: SparkTread
        product: GameCore
      - package: SparkTread
        product: GameApplication

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icell.sparktread
        PRODUCT_NAME: SparkTread
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # Landscape only, both variants, on phone and tablet. No portrait entries anywhere.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

schemes:
  SparkTread:
    build:
      targets:
        SparkTread: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
