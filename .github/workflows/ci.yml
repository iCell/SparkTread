name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # Full non-interactive gate (§18.3): architecture check, content
    # validation, package tests, xcodegen, scheme tests on the pinned
    # simulator destination.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run CI gate
        run: sh Scripts/ci.sh
